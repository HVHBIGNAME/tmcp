name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:lifecycle
      - run: sh -n install.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: .mcp-tunnel/build-cache
          key: windows-runtimes-${{ hashFiles('scripts/windows-runtime.json', 'scripts/cloudflared-release.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:standalone
      - run: npm run test:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: release/TMCP.exe
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [core, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone
          path: release
      - name: Publish the single verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DIGEST=$(sha256sum release/TMCP.exe | cut -d ' ' -f 1)
          printf '## Windows x64\n\nDownload **TMCP.exe** and run it. Node.js, .NET, Fixed WebView2 and cloudflared are included. The first launch extracts components into %%LOCALAPPDATA%%\\TMCP.\n\nEnable autostart in Settings to install the EXE permanently. Minimized startup is optional; the tray menu has a confirmed full shutdown. Existing app-issued keys and settings are preserved for the same home directory. To keep a previous installation, start it with `--home "C:\\path\\to\\old"`.\n\nLinux/macOS: `install.sh` from the tagged source builds the CLI.\n\nSHA-256: `%s`\n' "$DIGEST" > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/TMCP.exe --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-file notes.md --title "TMCP $RELEASE_TAG" release/TMCP.exe
          fi
  install-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install released CLI on Unix
        if: runner.os != 'Windows'
        env:
          TMCP_VERSION: ${{ inputs.tag || github.ref_name }}
          TMCP_HOME: ${{ runner.temp }}/tmcp-installed
          TMCP_ROOT: ${{ runner.temp }}
          TMCP_NO_START: '1'
          TMCP_NO_PATH: '1'
        run: |
          sh install.sh
          "$TMCP_HOME/bin/tmcp" --help
      - name: Install released CLI on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./install.ps1 -Mode cli -InstallDir "$env:RUNNER_TEMP/tmcp-installed" -Root "$env:RUNNER_TEMP" -Version $env:RELEASE_TAG -NoStart -NoPathUpdate
          & "$env:RUNNER_TEMP/tmcp-installed/bin/tmcp.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
