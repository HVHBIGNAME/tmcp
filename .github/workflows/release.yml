name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:lifecycle
      - run: sh -n install.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mcp-tunnel/build-cache
          key: windows-runtimes-${{ hashFiles('scripts/windows-runtime.json', 'scripts/cloudflared-release.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build with Windows PowerShell modules
        shell: powershell
        run: |
          $env:PSModulePath = "$PSHOME\Modules"
          npm run build:standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet run --project tests/UpdateClientTests/UpdateClientTests.csproj -c Release
      - run: dotnet run --project tests/WindowsUpdateTests/WindowsUpdateTests.csproj -c Release
      - name: Test standalone runtime and installation
        shell: powershell
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $env:PSModulePath = "$PSHOME\Modules"
          npm run test:standalone:headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:update-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: standalone-diagnostics
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/tmcp single exe */installed home/.mcp-tunnel/*.log
            ${{ runner.temp }}/tmcp single exe */installed home/application.json
            ${{ runner.temp }}/tmcp headless */home/.mcp-tunnel/*.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone
          path: release/TMCP.exe
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [core, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone
          path: release
      - name: Publish the single verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DIGEST=$(sha256sum release/TMCP.exe | cut -d ' ' -f 1)
          printf '## Windows x64\n\nDownload **TMCP.exe** and run it. Node.js, .NET, Fixed WebView2 and cloudflared are included. The first launch installs the working EXE and components into %%LOCALAPPDATA%%\\TMCP.\n\nAutomatic updates are enabled by default in the Windows GUI, including while it runs in the tray. The app checks stable GitHub releases, verifies the download, waits for idle, installs and restarts automatically. Failed startup restores the previous executable. Versions before 2.1.0 require this one manual upgrade.\n\nAutostart and minimized startup are optional in Settings; the tray menu has a confirmed full shutdown. Existing app-issued keys and settings are preserved for the same home directory. To keep a previous installation, start it with `--home "C:\\path\\to\\old"`.\n\nLinux/macOS and standalone CLI: update with the installer. `install.sh` from the tagged source builds the CLI.\n\nSHA-256: `%s`\n' "$DIGEST" > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/TMCP.exe --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-file notes.md --title "TMCP $RELEASE_TAG" release/TMCP.exe
          fi
  install-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install released CLI on Unix
        if: runner.os != 'Windows'
        env:
          TMCP_VERSION: ${{ inputs.tag || github.ref_name }}
          TMCP_HOME: ${{ runner.temp }}/tmcp-installed
          TMCP_ROOT: ${{ runner.temp }}
          TMCP_NO_START: '1'
          TMCP_NO_PATH: '1'
        run: |
          sh install.sh
          "$TMCP_HOME/bin/tmcp" --help
      - name: Install released CLI on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./install.ps1 -Mode cli -InstallDir "$env:RUNNER_TEMP/tmcp-installed" -Root "$env:RUNNER_TEMP" -Version $env:RELEASE_TAG -NoStart -NoPathUpdate
          & "$env:RUNNER_TEMP/tmcp-installed/bin/tmcp.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
